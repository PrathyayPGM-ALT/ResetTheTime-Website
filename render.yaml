services:
  - type: web
    name: resetthetime-website
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      # Durable mod storage (recommended). Set BOTH in the Render dashboard to
      # store uploaded mods in Supabase (Storage bucket + table) so they persist
      # and everyone can download them. Without these, mods fall back to the
      # local filesystem, which is EPHEMERAL on the free plan (wiped on redeploy).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY      # service_role key (server-side secret)
        sync: false
      # Optional: enable VirusTotal scans.
      - key: VT_API_KEY
        sync: false

    # Game builds under builds/ live in the repo, so they always deploy and
    # persist regardless of the above.
