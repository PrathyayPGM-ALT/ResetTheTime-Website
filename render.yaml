services:
  - type: web
    name: resetthetime
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      # Where uploaded mods + the index are stored (mounted disk below).
      - key: DATA_DIR
        value: /var/data
      # Optional: set in the Render dashboard to enable VirusTotal scans.
      - key: VT_API_KEY
        sync: false
    # Persistent disk so uploaded mods and the index survive redeploys/restarts.
    # (Without a disk, Render's filesystem is ephemeral and wipes uploads.)
    disk:
      name: mods-data
      mountPath: /var/data
      sizeGB: 1
